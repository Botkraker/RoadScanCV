# Stage 1 (anomaly detector) class map.
# Every conversion script reads this file; nothing is hard-coded elsewhere.
# Severity is NOT a class here: it is Stage 2, a separate classifier on box crops.

classes:
  0: pothole
  1: crack
  2: manhole

# source -> {source class -> target class name}. Anything not listed is dropped.
sources:
  rdd2020:            # Pascal VOC XML, train/Czech + train/India only
    D40: pothole
    D00: crack        # longitudinal
    D10: crack        # transverse
    D20: crack        # alligator
    # Only the 4 official RDD2020 classes (Arya et al. 2021). Every other code
    # (D01, D11, D43, D44, D50, D0w0) is dropped; the image is kept as background.

  mendeley_potholes:  # VOC XML + YOLO txt, class id 0
    pothole: pothole

  kaggle_pcm:         # labels-YOLO/ boxes
    0: pothole
    1: crack
    2: manhole

  shrec_pothole_mix:  # RGB masks; the class is the mask COLOUR. Boxes via OpenCV findContours
    colours:
      red: pothole    # (255,0,0)
      green: crack    # (0,255,0), NOT used: scattered speckles give poor boxes
    folders: [pothole600, cnr-road-dataset, cracks-and-potholes-in-road]
    # Images with green (crack) pixels are skipped entirely: boxing only the red
    # blobs would leave visible cracks unlabeled, i.e. teach "crack = background".
    # excluded folders (cracks only): crack500, edmcrack600, gaps384
    #   (thin cracks give poor boxes; GAPs384 academic-only, EdmCrack600 non-commercial)

  pothole_videos:     # rgb/ + mask/ -> frames -> boxes (potholes)
    mask: pothole

unlabeled:            # kept aside, never trained on as-is
  - PathCare
  - rdd2020 Japan train
  - rdd2020 test1/test2
  - shrec/videos      # color clips only, no masks, no depth
